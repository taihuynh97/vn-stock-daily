# Cấu hình job thu thập warehouse (Phase 1).

# Sàn cần thu. vnstock có thể trả mã sàn là HOSE hoặc HSX — code đã chuẩn hoá cả hai.
#
# LƯU Ý (xác minh 2026-08-10): danh sách này HIỆN KHÔNG ĐƯỢC THỰC THI.
# Listing(source='VCI').all_symbols() thật chỉ trả 2 cột [symbol, organ_name]
# — không có cột sàn — nên refresh_universe() (src/ingest_market.py) không
# tìm được exch_col, khối lọc `if exch_col:` không bao giờ chạy, và universe
# nạp vào dim_symbols thực tế là TOÀN BỘ ~1.598 mã cổ phiếu (bao gồm cả
# UPCOM), không dừng ở ~750 mã HOSE+HNX như comment cũ đã nói. Đổi hành vi
# lọc này là thay đổi lớn ngoài phạm vi bản sửa hiện tại — cột dim_symbols.
# exchange vẫn được điền đúng, chỉ riêng qua raw_company_info/
# update_symbol_exchanges (job monthly), không qua refresh_universe.
exchanges:
  - HOSE
  - HNX
  # - UPCOM

source: VCI            # nguồn dữ liệu cho price_board / listing
price_board_batch: 50  # số mã mỗi lần gọi bulk price_board

# Chỉ số thị trường thu hằng ngày. Lưu ý: giá trị chỉ số KHÔNG nhân 1000.
indices:
  - VNINDEX
  - VN30
  - HNXINDEX

# Job TUẦN chỉ nạp sự kiện DN cho mã có vốn hoá ≥ ngưỡng này (+ mã danh mục);
# job THÁNG vẫn quét mọi mã. Lý do (04/10/2026): nguồn iq.vietcap.com.vn bóp
# lưu lượng sau vài nghìn lệnh/ngày. 500 tỷ ≈ 600/1.603 mã, bao trọn vũ trụ
# của hồ sơ sàng lọc rộng nhất (deep_value: vốn hoá ≥500 tỷ).
weekly_events_min_market_cap_vnd: 500_000_000_000
