[pytest]
filterwarnings =
    # vnstock/vnai tự kiểm tra bản mới hơn qua mạng lúc import và phát UserWarning
    # "📦 Vnstock/Vnai X.Y.Z is available..." nếu có bản mới trên PyPI — không phải
    # cảnh báo của code chúng ta. Lọc HẸP đúng nội dung này (KHÔNG dùng
    # ignore::Warning bao trùm — che mất cảnh báo thật của chính ta là tệ hơn 2
    # dòng nhiễu).
    #
    # LƯU Ý: bộ lọc này MỘT MÌNH không dập được 2 warning đó. Ngay trước khi
    # warn(), vnstock tự gọi warnings.simplefilter("always", UserWarning) (xem
    # vnstock/core/utils/upgrade.py::_display_message) — việc này chèn một
    # filter "always" bắt MỌI UserWarning lên ĐẦU danh sách filter, đè lên
    # filter `ignore` hẹp này. Việc dập thật sự do tests/conftest.py đảm
    # nhiệm (mồi import vnstock trong catch_warnings trước khi bất kỳ test
    # nào chạy). Mục filterwarnings này được giữ lại vì vẫn đúng cú pháp/tinh
    # thần "lọc hẹp" và làm tài liệu — không xoá phòng trường hợp cơ chế mồi
    # ở conftest.py thay đổi trong tương lai.
    ignore:📦 (Vnstock|Vnai) .* is available:UserWarning
