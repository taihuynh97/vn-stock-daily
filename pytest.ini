[pytest]
filterwarnings =
    # vnstock/vnai tự kiểm tra bản mới hơn qua mạng lúc import và phát UserWarning
    # "📦 Vnstock/Vnai X.Y.Z is available..." nếu có bản mới trên PyPI — không phải
    # cảnh báo của code chúng ta, và nội dung đổi theo phiên bản cài đặt nên không
    # "sửa hết" được. Lọc HẸP đúng nội dung này (KHÔNG dùng ignore::Warning bao
    # trùm — che mất cảnh báo thật của chính ta là tệ hơn 2 dòng nhiễu).
    ignore:📦 (Vnstock|Vnai) .* is available:UserWarning
