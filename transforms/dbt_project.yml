name: vn_market
version: "1.0.0"
config-version: 2
profile: vn_market

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  vn_market:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table

seeds:
  vn_market:
    +quote_columns: false

vars:
  # Nhóm chỉ tiêu theo khả dụng — xác minh bằng VCB (ngân hàng) vs HPG (phi tài chính).
  # COMMON: cả hai đều có giá trị thật.
  # NONFIN: ngân hàng trả sentinel 0.0 → phải NULL hoá.
  # BANK:   phi tài chính trả sentinel 0.0/None → phải NULL hoá.
  metrics_common:
    - market_cap
    - number_of_shares_mkt_cap
    - dividend_yield
    - pe
    - pb
    - ps
    - roe
    - roa
    - debt_to_equity
    - gross_margin
    - pre_tax_profit_margin
    - after_tax_profit_margin
    - price_to_cash_flow
  metrics_nonfin:
    - roic
    - ev_to_ebitda
    - current_ratio
    - quick_ratio
    - cash_ratio
    - ebit_margin
    - asset_turnover
    - fixed_asset_turnover
    - cash_cycle
    - day_sale_outstanding
    - days_inventory_outstanding
    - days_payable_outstanding
    - ebit
    - ebitda
    - debt_per_equity
  metrics_bank:
    - net_interest_margin
    - average_yield_on_earning_assets
    - average_cost_of_financing
    - non_and_interest_income
    - cir
    - loans_growth
    - deposit_growth
    - equity_to_liabilities
    - equity_to_loans
    - total_equity_total_asset
    - ldr_loan_deposit_ratio
    - npl
    - loans_loss_reserve_to_loans
    - provision_to_outstanding_loans
    - car
    - casa_ratio
  # Fix round 1 (review C2): brief cũ coi OTHERFIN (bảo hiểm/chứng khoán) chỉ
  # dùng nhóm COMMON là SAI. Đo trên production: BH 478/478 (100%), CK
  # ~1.396/1.402 (99,6%) có giá trị THẬT ở roic/current_ratio/ebit... — tức
  # 14/15 chỉ tiêu metrics_nonfin áp dụng được cho OTHERFIN, chỉ
  # days_inventory_outstanding thật sự không áp dụng (chứng khoán/bảo hiểm
  # không có hàng tồn kho). Danh sách này = metrics_nonfin TRỪ
  # days_inventory_outstanding — applicable_metrics() dùng để quyết định điều
  # kiện NULL hoá cho từng chỉ tiêu trong metrics_nonfin.
  metrics_otherfin:
    - roic
    - ev_to_ebitda
    - current_ratio
    - quick_ratio
    - cash_ratio
    - ebit_margin
    - asset_turnover
    - fixed_asset_turnover
    - cash_cycle
    - day_sale_outstanding
    - days_payable_outstanding
    - ebit
    - ebitda
    - debt_per_equity
  # Số mã tối thiểu để một peer group được coi là đủ tin cậy.
  peer_min_size: 15
  # Số mã tuyệt đối tối thiểu để tính percentile.
  peer_hard_min: 8
  # Số quý tối thiểu để tính percentile định giá so với chính mã.
  own_history_min_quarters: 12
  # int_fundamentals_ttm (vòng review toàn nhánh, Minor 5.1): số quan sát tối
  # thiểu trong cửa sổ 12 quý để loss_quarters_12q/growth_consistency được coi
  # là đáng tin — nửa cửa sổ, cùng triết lý "phải đo được ít nhất một nửa" với
  # cổng weight_coverage >= 0,5 ở mart_stock_scorecard. Dưới ngưỡng này, cửa sổ
  # rỗng/gần rỗng cho ra 0 hoặc 1,0 — điểm TUYỆT ĐỐI dựng trên gần như không có
  # bằng chứng. Đo trên production: 360 mã báo "0 quý lỗ" với <8 quý dữ liệu.
  window_min_observed_quarters: 6
  # int_price_features (Task 3, fix round 2): số quan sát daily_return hợp lệ
  # (volume>0 cả hai đầu, không dính khoảng trống >15 ngày) tối thiểu trong
  # cửa sổ 60 phiên để volatility_60d được coi là đáng tin. Dưới ngưỡng này
  # NULL hoá và gắn cờ is_thin_trading — mẫu quá nhỏ khiến stddev_samp tự nó
  # nhiễu. Chọn 30 = "ít nhất nửa cửa sổ 60 phiên phải có giao dịch thật",
  # xác nhận bằng mô phỏng trên production: ngưỡng 20 cho max 0,1974 (sát nút
  # 0,20, dữ liệu nhích nhẹ là test đỏ), ngưỡng 30 cho max 0,1691 (an toàn).
  price_features_min_valid_sessions: 30
  # int_fundamentals_ttm (Task 4, fix round 1): dải hợp lý cho TRUNG VỊ
  # market_cap/revenue_ttm toàn thị trường (tương đương trung vị ps thật, vì
  # revenue_ttm = market_cap/ps nên market_cap/revenue_ttm = ps đại số).
  # Test ban đầu kiểm tra TỪNG DÒNG với dải market_cap/100..market_cap*100
  # (ps ∈ [0,01; 100]) đã báo động sai 344/36.676 dòng (0,94%) — toàn bộ là
  # mã cực đoan CÓ THẬT của VN market (VEF/SQC ôm quỹ đất doanh thu gần
  # zero, nano-cap thanh khoản cực mỏng), không phải lỗi công thức (đối
  # chiếu HPG khớp 0% tuyệt đối). Đo trên production: ps dương có p99=58,93,
  # p99,9=2.146,45 — một cổng kiểm từng dòng sẽ đỏ vĩnh viễn cho ~1% thị
  # trường thật. Đổi sang kiểm TRUNG VỊ: một lỗi công thức hệ thống (quên
  # chia, chia nhầm cột, sai đơn vị) kéo trung vị lệch nhiều bậc độ lớn,
  # trong khi vài trăm mã cực đoan không đủ sức kéo trung vị lệch khỏi dải
  # này (bài học C4 mảng A1: cổng báo động sai liên tục tệ hơn không có
  # cổng). p50 quan sát thực tế của ps quanh 1-3, dải 0,1-20 rộng rãi đủ để
  # chỉ bắt lỗi hệ thống thật.
  fundamentals_median_ps_min: 0.1
  fundamentals_median_ps_max: 20
  # int_price_adjustment (mảng Q): trên UPCoM giá tham chiếu = bình quân gia
  # quyền phiên trước (không phải giá đóng cửa) nên có nhiễu; chỉ coi là sự
  # kiện điều chỉnh khi lệch khỏi bình quân làm tròn quá ngưỡng này. Chọn bằng
  # số đo trên dữ liệu thật (29/09–02/10/2026: so với bình quân làm tròn, 99,4%
  # dòng UPCoM khớp tuyệt đối; chỉ 3/2.972 dòng lệch >15% và đều do hệ điều
  # chỉnh) — xem docs/Q-ket-qua-va-no-ky-thuat.md. Sự kiện nhỏ hơn ngưỡng trên
  # UPCoM KHÔNG được điều chỉnh.
  upcom_adjustment_min_deviation: 0.15

