version: 2

models:
  - name: stg_price_daily
    description: "Giá EOD đã chuẩn hoá đơn vị VNĐ, khử trùng theo (symbol, trade_date)."
    columns:
      - name: symbol
        tests: [not_null]
      - name: trade_date
        tests: [not_null]
      - name: close
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, trade_date]

  - name: stg_index_daily
    description: "Chỉ số thị trường. KHÔNG đổi đơn vị."
    columns:
      - name: index_code
        tests:
          - not_null
          - accepted_values:
              values: ['VNINDEX', 'VN30', 'HNXINDEX']
      - name: trade_date
        tests: [not_null]

  - name: stg_company_info
    columns:
      - name: symbol
        tests: [not_null, unique]
      - name: com_class
        tests:
          - not_null
          - accepted_values:
              values: ['NONFIN', 'BANK', 'OTHERFIN', 'UNKNOWN']

  - name: stg_industry
    columns:
      - name: icb_code
        tests: [not_null, unique]
      - name: level
        tests:
          - accepted_values:
              values: [1, 2, 3, 4]
              quote: false

  - name: stg_financial_ratio
    columns:
      - name: symbol
        tests: [not_null]
      - name: period_end_date
        tests: [not_null]
      - name: period_type
        tests:
          - accepted_values:
              values: ['quarter', 'year']
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, year, quarter]
      # Fix round 1 (review I1): khoá mà tầng sau (Task 5/6, window function)
      # thực sự dùng là (symbol, period_end_date) — nhưng quarter 4 (TTM) và
      # quarter 5 (cả năm) cho CÙNG period_end_date (31/12) với giá trị khác
      # nhau (VCB 2024: pe=14,8188 ở q4, pe=10,3303 ở q5). Test [symbol,
      # year, quarter] ở trên không bảo vệ khoá này. period_type phân biệt
      # được (quarter 1-4 -> 'quarter', quarter 5 -> 'year') nên tổ hợp dưới
      # đây mới đúng là khoá duy nhất thật sự.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, period_end_date, period_type]

  - name: stg_corporate_event
    description: >
      Sự kiện DN đã phân loại hai tầng. distribution_type dùng event_code
      làm tầng chính, chỉ đọc tiêu đề cho nhánh ISS. KHÔNG dùng cột
      category của nguồn (sai ở 14/33 dòng ISS — gán ESOP và phát hành
      riêng lẻ vào DIVIDEND).
    columns:
      - name: id
        tests: [not_null, unique]
      - name: symbol
        tests: [not_null]
      - name: distribution_type
        tests:
          - not_null
          - accepted_values:
              values: ['CASH_DIVIDEND', 'STOCK_DIVIDEND', 'BONUS_SHARE',
                       'ESOP', 'PRIVATE_PLACEMENT', 'ISS_KHAC',
                       'INSIDER_TRADING', 'SHAREHOLDER_MEETING', 'OTHER',
                       'UNKNOWN_CODE']
      - name: is_distribution
        tests: [not_null]

  - name: stg_shareholder
    description: >
      Cổ đông ĐÃ CÔNG BỐ, snapshot theo ngày. Tổng share_own_percent KHÔNG
      bằng 100% (HPG 51,9%, VNM 81,0%, VCB 91,0%) — phần thiếu là cổ đông
      không công bố, KHÔNG đồng nghĩa free float.
    columns:
      - name: symbol
        tests: [not_null]
      - name: share_holder
        tests: [not_null]
      - name: snapshot_date
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, share_holder, snapshot_date]

  - name: stg_officer
    columns:
      - name: symbol
        tests: [not_null]
      - name: officer_name
        tests: [not_null]
      - name: snapshot_date
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, officer_name, snapshot_date]

  - name: stg_financial_statement
    description: >
      Chi tiết BCTC dạng dài (income_statement/balance_sheet/cash_flow).
      Khoá là (symbol, statement_type, period_type, period_label, row_seq)
      — row_seq (vị trí dòng gốc) thay cho item_id vì item_id KHÔNG unique
      trong một báo cáo (vd 'cost' xuất hiện 4 lần ở balance_sheet, mỗi
      lần một nhóm tài sản cố định khác nhau).
    columns:
      - name: symbol
        tests: [not_null]
      - name: statement_type
        tests:
          - not_null
          - accepted_values:
              values: ['income_statement', 'balance_sheet', 'cash_flow']
      - name: period_type
        tests:
          - not_null
          - accepted_values:
              values: ['quarter', 'year']
      - name: item_id
        tests: [not_null]
      - name: item_vi
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            [symbol, statement_type, period_type, period_label, row_seq]

  - name: stg_exchange_rate
    description: "Tỷ giá VCB hằng ngày. Khoá (currency_code, rate_date)."
    columns:
      - name: currency_code
        tests: [not_null]
      - name: rate_date
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [currency_code, rate_date]

  - name: stg_news
    description: >
      Tin tức 5 mã portfolio (config/portfolio.yml). id ổn định qua
      Company.news(), append-only ở tầng raw — xem Task 1/2 kế hoạch D.
    columns:
      - name: id
        tests: [not_null, unique]
      - name: symbol
        tests: [not_null]
      - name: news_title
        tests: [not_null]
