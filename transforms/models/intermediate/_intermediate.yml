version: 2

models:
  - name: int_price_adjustment
    description: >
      Sự kiện điều chỉnh giá phát hiện từ giá tham chiếu của sàn: factor =
      ref_price(D) / close(phiên liền trước theo lịch VNINDEX). Một dòng mỗi
      (mã, ngày GDKHQ). Gồm cả cổ tức tiền (factor gần 1) lẫn chia/thưởng.
    columns:
      - name: factor
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, ex_date]

  - name: int_quarterly_profit
    description: >
      LNST từng quý đọc thẳng từ BCTC gốc (không suy từ tỷ số TTM) cùng số quý
      lỗ thật trong 4 và 12 quý. Thay cho loss_quarters_12q (đếm quý có LNST
      lũy kế 4 quý âm) ở thành phần safety và cổng rủi ro (mảng Q).
    columns:
      - name: net_profit
        tests: [not_null]
      - name: profit_item_id
        tests:
          - accepted_values:
              values: ['attributable_to_parent_company',
                       'net_profit_attributable_to_shareholders_of_the_group',
                       'net_profit_loss_after_tax', 'profit_after_tax']
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, year, quarter]

  - name: int_price_features
    description: "Chỉ báo giá, thanh khoản và biến động theo phiên — tính trên adj_close (mảng Q)."
    columns:
      - name: symbol
        tests: [not_null]
      - name: trade_date
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, trade_date]

  - name: int_fundamentals_ttm
    description: "Doanh thu/LNST/vốn chủ suy ra từ market_cap và ps/pe/pb, kèm tăng trưởng."
    columns:
      - name: symbol
        tests: [not_null]
      - name: period_end_date
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, period_end_date]

  - name: int_quality_metrics
    columns:
      - name: symbol
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, period_end_date]

  - name: int_dividend_history
    columns:
      - name: symbol
        tests: [not_null, unique]

  - name: int_metric_long
    columns:
      - name: symbol
        tests: [not_null]
      - name: metric
        tests: [not_null]
      - name: value
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, metric]

  - name: int_distribution_event
    description: >
      Chỉ sự kiện PHÂN PHỐI cho cổ đông (tiền mặt, cổ tức cổ phiếu, cổ
      phiếu thưởng). Trục thời gian là NGÀY GDKHQ, khác trục năm tài chính
      của dividend_yield — không cộng gộp hai trục.
    columns:
      - name: symbol
        tests: [not_null]
      - name: event_id
        tests: [not_null, unique]
      - name: exright_date
        tests: [not_null]
      - name: distribution_type
        tests:
          - not_null
          - accepted_values:
              values: ['CASH_DIVIDEND', 'STOCK_DIVIDEND', 'BONUS_SHARE']

  - name: int_ownership_snapshot
    description: >
      Cô đặc sở hữu theo snapshot mới nhất. total_disclosed_pct là cột bắt
      buộc — tổng % công bố không bằng 100%, giấu nó đi thì người đọc suy
      ra sai "phần còn lại là free float".
    columns:
      - name: symbol
        tests: [not_null, unique]
      - name: snapshot_date
        tests: [not_null]
      - name: total_disclosed_pct
        tests: [not_null]
      - name: officer_snapshot_date
        description: >
          Ngày snapshot của bảng officer — KHÁC snapshot_date (ngày snapshot
          của cổ đông). Hai ngày có thể lệch nhau nếu một mã lỗi fetch ở lần
          chạy monthly cho một trong hai nguồn (I1, fix round cuối). NULL
          khi mã không có officer nào — không bắt buộc not_null.

  - name: int_valuation_percentile
    columns:
      - name: symbol
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, period_end_date]

  - name: int_metric_percentile
    columns:
      - name: symbol
        tests: [not_null]
      - name: metric
        tests: [not_null]
      - name: peer_basis
        tests:
          - accepted_values:
              values: ['com_class+icb_lv2', 'com_class']
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, metric]
