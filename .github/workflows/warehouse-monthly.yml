name: warehouse-monthly

on:
  schedule:
    # Ngày 1 hàng tháng lúc 09:00 UTC
    - cron: "0 9 1 * *"
  workflow_dispatch: {}

jobs:
  warehouse-monthly:
    runs-on: ubuntu-latest
    # Fix trần 360 phút của GitHub Actions (final review B2): GitHub GIẾT
    # job ở đúng mốc 360 phút mà không cảnh báo gì. Đặt 350 để job tự fail
    # RÕ RÀNG trước mốc đó (có dòng lỗi timeout trong log) thay vì bị giết
    # âm thầm. Job monthly đo thật ở Task 5 mất 767 phút — xem thêm phần
    # ghi lô (STATEMENT_CHUNK_SIZE) trong build_warehouse.py: khi job bị
    # cắt, các lô BCTC đã ghi vẫn còn, lần chạy sau tiếp tục phần thiếu.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Warehouse monthly (giá + ratios + sự kiện DN + hồ sơ DN + sở hữu + BCTC chi tiết)
        env:
          WAREHOUSE_DB: "md:vn_market"
          motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_MIN_INTERVAL: "1.05"
        run: python build_warehouse.py --mode monthly

      - name: Đối chiếu chéo warehouse
        env:
          WAREHOUSE_DB: "md:vn_market"
          motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_MIN_INTERVAL: "1.05"
        run: python -m scripts.reconcile_warehouse --sample 5

      - name: dbt deps
        working-directory: transforms
        run: dbt deps --profiles-dir .

      - name: dbt seed
        working-directory: transforms
        env:
          WAREHOUSE_DB: "md:vn_market"
          motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: dbt seed --profiles-dir . --no-partial-parse

      - name: dbt build (toàn bộ)
        working-directory: transforms
        env:
          WAREHOUSE_DB: "md:vn_market"
          motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: dbt build --profiles-dir . --no-partial-parse

      - name: dbt source freshness
        working-directory: transforms
        env:
          WAREHOUSE_DB: "md:vn_market"
          motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: dbt source freshness --profiles-dir .
