name: diagnose-api

# Chẩn đoán độ trễ API vnstock từ máy chủ GitHub (chỉ đọc, không ghi warehouse).
# So với cùng script chạy trên máy cá nhân ở VN để biết job tuần chậm do VỊ TRÍ
# máy chạy hay do code/nguồn. Xem scripts/diagnose_api.py.
#
# CHỈ CHẠY TAY: bản đầu tự chạy khi đổi script, và lần merge PR #13 đã kích
# hoạt nó chạy SONG SONG với job tuần trên cùng khoá API (04/10/2026). Không
# chạy cùng lúc với job warehouse-*: hai bên chia nhau hạn mức 60 lần/phút.
on:
  workflow_dispatch:
    inputs:
      n:
        description: "Số mã trong mẫu (tối đa 30)"
        default: "30"
      parallel:
        description: "Đo thêm BCTC gọi song song 5 luồng (nguồn CHẶN — chỉ bật khi cần đo lại)"
        type: boolean
        default: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Đo độ trễ API (cùng nhịp giãn cách với job thật)
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_MIN_INTERVAL: "1.05"
          DIAG_WHERE: "GitHub Actions (ubuntu-latest)"
        run: python -m scripts.diagnose_api --n "${{ github.event.inputs.n || '30' }}" --max-minutes 45 --out diag.json
      - name: Đo BCTC quý gọi song song 5 luồng (cùng hạn mức 60 lần/phút)
        if: ${{ github.event.inputs.parallel == 'true' }}
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_MIN_INTERVAL: "1.05"
          DIAG_WHERE: "GitHub Actions (ubuntu-latest)"
        run: python -m scripts.diagnose_api --n 30 --statements-workers 5 --out diag-parallel.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-api
          path: diag*.json
